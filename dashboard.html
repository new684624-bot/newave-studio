  if (fullTitle.length <= 48) return fullTitle;
  const words = fullTitle.split(' ');
  let out = '';

}

function makeZazzle10Tags(mainTag, supportingStr) {
  const sup = supportingStr.split(',').map(s => s.trim()).filter(Boolean);
  const all10 = [mainTag.trim(), ...sup].slice(0, 10);
  return all10.map(t => t.includes(' ') ? `"${t}"` : t).join(' ');
}

function loadState() {
  const saved = localStorage.getItem('nws_mobile_state_v1');
  let state = saved ? JSON.parse(saved) : {};
  DESIGNS.forEach(d => {
    if (!state[d.id]) {
      state[d.id] = { rb: !!d.rb_done, tp: !!d.tp_done, zz: !!d.zz_done };
    }
  });
  return state;
}

let STATE = loadState();

function togglePlat(id, plat, checked) {
  if (!STATE[id]) STATE[id] = { rb: false, tp: false, zz: false };
  STATE[id][plat] = checked;
  localStorage.setItem('nws_mobile_state_v1', JSON.stringify(STATE));
  renderAll();
}

function copyText(text, label) {
  navigator.clipboard.writeText(text);
  showToast('✅ ก๊อป ' + label + ' แล้ว!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 1400);
}

function setFilter(f) {
  ACTIVE_FILTER = f;
  renderAll();
}

function renderFilterBar() {
  const bar = document.getElementById('filterBar');
  const btns = [
    { id: 'all', label: `📦 ทั้งหมด (${DESIGNS.length})` },
    ...COLLECTIONS.map(c => {
      const cnt = DESIGNS.filter(d => d.cid === c.cid).length;
      return { id: c.cid, label: `${c.icon} ${c.name.split('(')[0].replace(/Collection \d+:\s*/, '')} (${cnt})` };
    })
  ];
  bar.innerHTML = btns.map(b => `
    <button class="f-btn ${ACTIVE_FILTER === b.id ? 'active' : ''}" onclick="setFilter('${b.id}')">${b.label}</button>
  `).join('');
}

function renderAll() {
  renderFilterBar();
  const container = document.getElementById('cardsContainer');
  const visibleCols = ACTIVE_FILTER === 'all' ? COLLECTIONS : COLLECTIONS.filter(c => c.cid === ACTIVE_FILTER);

  container.innerHTML = visibleCols.map(col => {
    const items = DESIGNS.filter(d => d.cid === col.cid);
    if (!items.length) return '';

    const cardsHtml = items.map(d => {
      const s = STATE[d.id] || { rb: false, tp: false, zz: false };
      const zzTitle = makeZazzleTitle(d.title);
      const zzTags = makeZazzle10Tags(d.main_tag, d.supporting_tags);
      const isEv = d.season.includes('Evergreen');
      const thumb = d.web_thumb || ('assets/thumbs/thumb_' + d.id + '.jpg');

      let badges = `<span class="badge">#${d.id}</span>`;
      if (s.rb) badges += `<span class="badge" style="background:#ef4444; color:#fff;">🔴 RB</span>`;
      if (s.tp) badges += `<span class="badge" style="background:#3b82f6; color:#fff;">🔵 TP</span>`;
      if (s.zz) badges += `<span class="badge" style="background:#a855f7; color:#fff;">🟣 ZZ</span>`;

      return `
        <div class="card">
          <div class="card-top">
            <div class="thumb-wrap" style="background:${d.bg}">
              <img src="${thumb}" alt="${d.id}" loading="lazy" onerror="this.src='assets/logo.jpg'">
            </div>
            <div class="meta">
              <div class="badge-row">${badges}</div>
              <div class="card-title">${d.title}</div>
              <div class="card-subtext">📁 ${d.files[0]}</div>
              <a href="${thumb}" download="NewaveStudio_${d.id}.jpg" class="btn-download-img">📥 เซฟรูปลงมือถือ</a>
            </div>
          </div>

          <div class="status-row">
            <span style="color:#94a3b8; font-weight:700;">สถานะ:</span>
            <label style="color:#f87171;"><input type="checkbox" ${s.rb ? 'checked' : ''} onchange="togglePlat('${d.id}','rb',this.checked)"> Redbubble</label>
            <label style="color:#60a5fa;"><input type="checkbox" ${s.tp ? 'checked' : ''} onchange="togglePlat('${d.id}','tp',this.checked)"> TeePublic</label>
            <label style="color:#c084fc;"><input type="checkbox" ${s.zz ? 'checked' : ''} onchange="togglePlat('${d.id}','zz',this.checked)"> Zazzle</label>
          </div>

          <div class="copy-stack">
            <!-- Title -->
            <button class="btn-tap-copy" onclick="copyText(${JSON.stringify(d.title)}, 'Title')">
              <span>📋 Copy Title (RB/TP)</span>
              <span style="font-size:11px; opacity:0.6;">กดแตะ</span>
            </button>

            <!-- Zazzle Title -->
            <button class="btn-tap-copy zazzle" onclick="copyText(${JSON.stringify(zzTitle)}, 'Zazzle Title (≤48)')">
              <span style="color:#e9d5ff;">🟣 Copy Zazzle Title (≤48)</span>
              <span style="font-size:11px; opacity:0.6;">กดแตะ</span>
            </button>

            <!-- Main Tag -->
            <button class="btn-tap-copy" onclick="copyText(${JSON.stringify(d.main_tag)}, 'Main Tag')">
              <span>🏷️ Main Tag: <b>${d.main_tag}</b></span>
              <span style="font-size:11px; opacity:0.6;">กดแตะ</span>
            </button>

            <!-- 14 Tags -->
            <button class="btn-tap-copy" onclick="copyText(${JSON.stringify(d.supporting_tags)}, '14 Tags')">
              <span>🏷️ Copy 14 Tags (RB/TP)</span>
              <span style="font-size:11px; opacity:0.6;">กดแตะ</span>
            </button>

            <!-- Zazzle 10 Tags -->
            <button class="btn-tap-copy zazzle" onclick="copyText(${JSON.stringify(zzTags)}, 'Zazzle 10 Tags')">
              <span style="color:#e9d5ff;">🟣 Copy Zazzle 10 Tags</span>
              <span style="font-size:11px; opacity:0.6;">กดแตะ</span>
            </button>

            <!-- Description -->
            <button class="btn-tap-copy" onclick="copyText(${JSON.stringify(d.desc)}, 'Description')">
              <span>📝 Copy Description (ทุกเว็บ)</span>
              <span style="font-size:11px; opacity:0.6;">กดแตะ</span>
            </button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div style="margin-bottom:24px;">
        <div class="col-banner">
          <h2>${col.icon} ${col.name.split('(')[0]}</h2>
          <p>${col.col_title}</p>
          <div class="col-btn-row">
            <button class="btn-col-copy" onclick="copyText(${JSON.stringify(col.col_title)}, 'ชื่อ Collection')">📋 ก๊อปชื่อ Collection</button>
            <button class="btn-col-copy" onclick="copyText(${JSON.stringify(col.col_tags)}, '5 Tags')">🟣 ก๊อป 5 Tags</button>
          </div>
        </div>
        ${cardsHtml}
      </div>
    `;
  }).join('');
}

renderAll();
</script>
</body>
</html>
