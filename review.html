<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>Newave Studio® — 1-Click Design Review v2.5</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151d30;
            --surface-card: #1c2742;
            --border: #283756;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --green: #10b981;
            --red: #ef4444;
            --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 10px 80px;
        }
        .header {
            width: 100%;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            margin-bottom: 6px;
        }
        .brand-logo {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .sync-btn {
            background: #1e293b;
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 100%;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 4px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #1e293b;
            border-color: var(--accent);
            color: var(--accent);
        }
        
        /* Responsive Container */
        .review-wrapper {
            width: 100%;
            max-width: 480px;
            transition: max-width 0.3s ease;
            margin: 0 auto;
        }
        body.force-desktop .review-wrapper {
            max-width: 960px !important;
        }
        body.force-mobile .review-wrapper {
            max-width: 480px !important;
        }
        @media (min-width: 860px) {
            .review-wrapper {
                max-width: 960px;
            }
        }

        .review-card-container {
            width: 100%;
            margin-bottom: 16px;
        }
        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.3s ease;
        }
        @media (min-width: 860px) {
            .review-card {
                flex-direction: row;
                min-height: 480px;
            }
            .preview-img-box {
                width: 48% !important;
                height: auto !important;
                min-height: 480px !important;
                border-right: 1px solid var(--border);
            }
            .card-body {
                width: 52% !important;
                padding: 28px !important;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .card-title {
                font-size: 1.45rem !important;
            }
            .controls-grid {
                grid-template-columns: 1fr 1fr 2fr !important;
                gap: 12px !important;
            }
            .btn-undo {
                grid-column: span 3 !important;
            }
        }
        body.force-desktop .review-card {
            flex-direction: row !important;
            min-height: 480px !important;
        }
        body.force-desktop .preview-img-box {
            width: 48% !important;
            height: auto !important;
            min-height: 480px !important;
            border-right: 1px solid var(--border);
        }
        body.force-desktop .card-body {
            width: 52% !important;
            padding: 28px !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        body.force-desktop .card-title {
            font-size: 1.45rem !important;
        }
        body.force-desktop .controls-grid {
            grid-template-columns: 1fr 1fr 2fr !important;
            gap: 12px !important;
        }
        body.force-desktop .btn-undo {
            grid-column: span 3 !important;
        }

        body.force-mobile .review-card {
            flex-direction: column !important;
        }
        body.force-mobile .preview-img-box {
            width: 100% !important;
            height: 360px !important;
            border-right: none !important;
        }
        body.force-mobile .card-body {
            width: 100% !important;
            padding: 16px !important;
        }
        body.force-mobile .controls-grid {
            grid-template-columns: 1fr 1fr !important;
        }
        body.force-mobile .btn-undo {
            grid-column: span 2 !important;
        }
        .preview-img-box {
            width: 100%;
            height: 360px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .preview-img-box img {
            width: 92%;
            height: 92%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        .badge-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .badge-green { color: var(--green); border-color: rgba(16, 185, 129, 0.4); }
        .badge-gold { color: var(--gold); border-color: rgba(245, 158, 11, 0.4); }
        .card-body {
            padding: 16px;
        }
        .card-title {
            font-size: 1.18rem;
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-quote {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 12px;
            font-style: italic;
        }
        .card-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--surface-card);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .meta-label { color: var(--text-sub); font-size: 0.7rem; margin-bottom: 2px; }
        .meta-val { font-weight: 700; color: #fff; }

        /* 4-Button Controls Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            margin-bottom: 8px;
        }
        .btn {
            border: none;
            outline: none;
            border-radius: 16px;
            padding: 14px 10px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-discard {
            background: #1e2433;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-hold {
            background: #1e293b;
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .btn-undo {
            background: #182030;
            color: var(--text-sub);
            border: 1px solid var(--border);
            grid-column: span 2;
            padding: 10px;
            font-size: 0.82rem;
        }
        .btn-approve {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(16, 185, 129, 0.35);
        }

        /* Toast Notice */
        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--accent);
            display: none;
            z-index: 1000;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 40px 16px;
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            border: 1px dashed var(--border);
        }
        .nav-links {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            font-size: 0.82rem;
        }
        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            padding: 8px 12px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
        }
    </style>
</head>

        </div>
    </div>

        let currentTab = 'pending';
        let pendingQueue = JSON.parse(localStorage.getItem('nws_pending_queue') || 'null');
        let holdQueue = JSON.parse(localStorage.getItem('nws_hold_queue') || '[]');
        let approvedList = JSON.parse(localStorage.getItem('nws_approved_designs') || '[]');
        let discardList = JSON.parse(localStorage.getItem('nws_discard_designs') || '[]');
        let historyStack = [];

        // AUTO-SYNC: Fetches fresh remote pending_queue.json AND merges with local catalog
        async function syncServerDesigns(silent = false) {
            let remoteCatalog = SERVER_CATALOG;
            try {
                const res = await fetch('pending_queue.json?t=' + Date.now());
                if (res.ok) {
                    const fetched = await res.json();
                    if (Array.isArray(fetched) && fetched.length > 0) {
                        remoteCatalog = fetched;
                    }
                }
            } catch (err) {
                console.warn('Using local fallback catalog:', err);
            }

            const seenIds = new Set([
                ...(pendingQueue ? pendingQueue.map(x => x.id) : []),
                ...holdQueue.map(x => x.id),
                ...approvedList.map(x => x.id),
                ...discardList.map(x => x.id)
            ]);

            const newFromRemote = remoteCatalog.filter(item => !seenIds.has(item.id));
            if (!pendingQueue) {
                pendingQueue = [...remoteCatalog];
            } else if (newFromRemote.length > 0) {
                // Prepend new designs to the front of the queue
                pendingQueue = [...newFromRemote, ...pendingQueue];
            }
            localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            if (!silent && newFromRemote.length > 0) {
                showToast(`🔔 ดึงลายใหม่สำเร็จ ${newFromRemote.length} ลาย!`);
            }
            renderCard();
            return;
        }

        function _legacySyncServerDesigns(silent = false) {
            const seenIds = new Set([
                ...(pendingQueue ? pendingQueue.map(x => x.id) : []),
                ...holdQueue.map(x => x.id),
                ...approvedList.map(x => x.id),
                ...discardList.map(x => x.id)
            ]);

            const newFromRemote = SERVER_CATALOG.filter(item => !seenIds.has(item.id));
            if (!pendingQueue) {
                pendingQueue = [...SERVER_CATALOG];
            } else if (newFromRemote.length > 0) {
                // Prepend new designs to the front of the queue
                pendingQueue = [...newFromRemote, ...pendingQueue];
            }
            localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            if (!silent && newFromRemote.length > 0) {
                showToast(`🔔 ดึงลายใหม่สำเร็จ ${newFromRemote.length} ลาย!`);
            }
            renderCard();
        }

        function forceSyncServer(resetAll = false) {
            if (resetAll) {
                if (confirm('คุณต้องการรีเซ็ตคลังตรวจทั้งหมดเพื่อเริ่มตรวจใหม่ใช่ไหม?')) {
                    localStorage.removeItem('nws_pending_queue');
                    localStorage.removeItem('nws_hold_queue');
                    localStorage.removeItem('nws_discard_designs');
                    pendingQueue = [...SERVER_CATALOG];
                    holdQueue = [];
                    localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
                    showToast('🔄 รีเซ็ตคลังตรวจกลับมาครบ 8 ลายแล้ว!');
                    currentTab = 'pending';
                    switchTab('pending');
                }
                return;
            }
            syncServerDesigns(false);
            showToast('✅ ซิงค์คลังลายล่าสุดเรียบร้อย!');
        }

        function showToast(msg) {
            const t = document.getElementById('toastNotice');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function updateCounts() {
            document.getElementById('cPending').innerText = pendingQueue.length;
            document.getElementById('cHold').innerText = holdQueue.length;
            document.getElementById('cApproved').innerText = approvedList.length;
            document.getElementById('btnUndo').style.display = historyStack.length > 0 ? 'flex' : 'none';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabPending').className = 'tab-btn' + (tab === 'pending' ? ' active' : '');
            document.getElementById('tabHold').className = 'tab-btn' + (tab === 'hold' ? ' active' : '');
            document.getElementById('tabApproved').className = 'tab-btn' + (tab === 'approved' ? ' active' : '');
            renderCard();
        }

        function getActiveList() {
            if (currentTab === 'pending') return pendingQueue;
            if (currentTab === 'hold') return holdQueue;
            if (currentTab === 'approved') return approvedList;
            return [];
        }

        function renderCard() {
            updateCounts();
            const list = getActiveList();
            const container = document.getElementById('cardContainer');
            const controls = document.getElementById('controlsGrid');
            const empty = document.getElementById('emptyState');

            // SPECIAL APPROVED TAB: Render Gallery List of All Approved Items
            if (currentTab === 'approved') {
                controls.style.display = 'none';
                if (approvedList.length === 0) {
                    container.style.display = 'none';
                    empty.style.display = 'block';
                    document.getElementById('emptyTitle').innerText = 'ยังไม่มีลายที่อนุมัติ';
                    document.getElementById('emptySub').innerText = 'กดแท็บ "รอดำเนินการ" แล้วกด ✅ เอาลายนี้ (APPROVE) เพื่อบันทึกเข้าสู่ Dashboard ครับ';
                    return;
                }

                container.style.display = 'block';
                empty.style.display = 'none';

                let approvedCardsHtml = approvedList.map(item => `
                    <div style="background:var(--surface); border:1px solid rgba(16,185,129,0.4); border-radius:18px; padding:14px; margin-bottom:12px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
                        <div style="width:80px; height:96px; border-radius:10px; overflow:hidden; background:#000; flex-shrink:0; border:1px solid var(--border);">
                            <img src="${item.thumb}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='assets/thumbs/thumb_28.jpg'">
                        </div>
                        <div style="flex:1; min-width:200px;">
                            <div style="display:flex; gap:6px; align-items:center; margin-bottom:4px;">
                                <span style="font-size:11px; background:#10b981; color:#0b0f19; font-weight:800; padding:2px 8px; border-radius:6px;">✅ อนุมัติแล้ว</span>
                                <span style="font-size:11px; color:var(--text-sub); font-weight:700;">#${item.id}</span>
                            </div>
                            <h4 style="font-size:14px; color:#fff; font-weight:700; margin-bottom:2px;">${item.title}</h4>
                            <p style="font-size:12px; color:var(--accent); margin-bottom:6px;">${item.style || item.category || ''}</p>
                            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                                <a href="${item.thumb}" download="Newave_${item.id}.jpg" style="background:#1e293b; color:#38bdf8; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">📥 โหลดรูป</a>
                                <a href="dashboard.html?filter=approved#card-${item.id}" style="background:#10b981; color:#0b0f19; font-size:11.5px; font-weight:800; padding:5px 12px; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:4px;">📋 ไปก็อปปี้ข้อมูล ➔</a>
                                <button onclick="unapproveItem('${item.id}')" style="background:transparent; color:#ef4444; border:1px solid rgba(239,68,68,0.4); font-size:11px; font-weight:700; padding:4px 8px; border-radius:8px; cursor:pointer;">↩️ ตรวจใหม่</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div style="margin-bottom:16px;">
                        <div style="background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.4); border-radius:16px; padding:16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                            <div>
                                <h3 style="color:#34d399; font-size:15px; font-weight:800; margin-bottom:2px;">🟢 บันทึกลายที่อนุมัติแล้ว (${approvedList.length} ลาย)</h3>
                                <p style="color:var(--text-sub); font-size:12px;">ทุกลายถูกเซฟในระบบอย่างถาวร สามารถเปิดใน Upload Dashboard เพื่อคัดลอกข้อมูลได้ทันที</p>
                            </div>
                            <a href="dashboard.html?filter=approved" style="background:#10b981; color:#0b0f19; font-size:13px; font-weight:800; padding:10px 18px; border-radius:12px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                                📱 เปิด Upload Dashboard ➔
                            </a>
                        </div>
                        ${approvedCardsHtml}
                    </div>
                `;
                return;
            }

            // PENDING & HOLD TABS: Normal Step-by-Step Card Flow
            if (list.length === 0) {
                container.style.display = 'none';
                controls.style.display = 'none';
                empty.style.display = 'block';
                if (currentTab === 'hold') {
                    document.getElementById('emptyTitle').innerText = 'ไม่มีลายที่เก็บไว้';
                    document.getElementById('emptySub').innerText = 'เมื่อคุณกด "ข้ามไว้ก่อน" ลายจะมาสะสมอยู่ที่นี่ครับ';
                } else {
                    document.getElementById('emptyTitle').innerText = 'ตรวจครบทุกแบบแล้ว!';
                    document.getElementById('emptySub').innerText = 'ระบบบันทึกลายที่ผ่านเข้าคิวผลิตเรียบร้อย';
                }
                return;
            }

            container.style.display = 'block';
            controls.style.display = 'grid';
            empty.style.display = 'none';

            const item = list[0];
            container.innerHTML = `
                <div class="review-card">
                    <div class="preview-img-box">
                        <div class="badge-bar">
                            <span class="badge badge-green">🛡️ Trademark Clean</span>
                            <span class="badge badge-gold">${item.seo_rank || 'Top Trend'}</span>
                        </div>
                        <img src="${item.thumb}" alt="${item.title}" onerror="this.src='assets/thumbs/thumb_28.jpg'">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <div class="card-quote">"${item.quote}"</div>
                        <div class="card-meta">
                            <div>
                                <div class="meta-label">หมวดหมู่ & สไตล์</div>
                                <div class="meta-val">${item.style}</div>
                            </div>
                            <div>
                                <div class="meta-label">สินค้าทำเงิน</div>
                                <div class="meta-val">${item.suggested_products}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function unapproveItem(id) {
            const found = approvedList.find(x => x.id === id);
            if (!found) return;
            approvedList = approvedList.filter(x => x.id !== id);
            localStorage.setItem('nws_approved_designs', JSON.stringify(approvedList));
            pendingQueue.unshift(found);
            localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            showToast('↩️ ดึงลาย #' + id + ' กลับมาคอยตรวจเรียบร้อย!');
            renderCard();
        }

        function handleDecision(action) {
            const list = getActiveList();
            if (list.length === 0) return;

            const item = list.shift();
            historyStack.push({ action, item, fromTab: currentTab });

            if (action === 'approve') {
                if (!approvedList.some(d => d.id === item.id)) {
                    approvedList.push(item);
                    localStorage.setItem('nws_approved_designs', JSON.stringify(approvedList));
                }
                showToast('✅ อนุมัติลายนี้เรียบร้อย!');
            } else if (action === 'hold') {
                if (currentTab === 'pending') {
                    holdQueue.push(item);
                    localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
                } else {
                    list.push(item);
                }
                showToast('⏳ เก็บไว้ในคิวแล้ว (ไม่โดนตัดทิ้งแน่นอน!)');
            } else if (action === 'discard') {
                discardList.push(item);
                localStorage.setItem('nws_discard_designs', JSON.stringify(discardList));
                showToast('🗑️ ปฏิเสธลายนี้แล้ว');
            }

            localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
            renderCard();
        }

        function handleUndo() {
            if (historyStack.length === 0) return;
            const last = historyStack.pop();
            
            if (last.action === 'approve') {
                approvedList = approvedList.filter(d => d.id !== last.item.id);
                localStorage.setItem('nws_approved_designs', JSON.stringify(approvedList));
            } else if (last.action === 'hold') {
                holdQueue = holdQueue.filter(d => d.id !== last.item.id);
                localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
            } else if (last.action === 'discard') {
                discardList = discardList.filter(d => d.id !== last.item.id);
                localStorage.setItem('nws_discard_designs', JSON.stringify(discardList));
            }
            
            if (last.fromTab === 'pending') {
                pendingQueue.unshift(last.item);
                localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            } else if (last.fromTab === 'hold') {
                holdQueue.unshift(last.item);
                localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
            }

            currentTab = last.fromTab;
            switchTab(currentTab);
            showToast('↩️ ย้อนกลับรายการสำเร็จ');
        }

        // Run sync on page load
        
        function setReviewView(mode) {
            document.body.classList.remove('force-mobile', 'force-desktop');
            const bA = document.getElementById('rBtnAuto');
            const bD = document.getElementById('rBtnDesktop');
            const bM = document.getElementById('rBtnMobile');
            if (bA) bA.style.background = 'transparent';
            if (bD) bD.style.background = 'transparent';
            if (bM) bM.style.background = 'transparent';

            if (mode === 'desktop') {
                document.body.classList.add('force-desktop');
                if (bD) { bD.style.background = '#1e293b'; bD.style.color = 'var(--accent)'; }
            } else if (mode === 'mobile') {
                document.body.classList.add('force-mobile');
                if (bM) { bM.style.background = '#1e293b'; bM.style.color = 'var(--accent)'; }
            } else {
                if (bA) { bA.style.background = '#1e293b'; bA.style.color = 'var(--accent)'; }
            }
            localStorage.setItem('nws_review_view_mode', mode);
        }
        const savedRevView = localStorage.getItem('nws_review_view_mode') || 'auto';
        setReviewView(savedRevView);

        syncServerDesigns(true);
    </script>
