<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newave Studio® — 1-Click Design Review v2.5</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #151d30;
            --surface-card: #1c2742;
            --border: #283756;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --green: #10b981;
            --red: #ef4444;
            --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 10px 80px;
        }
        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            margin-bottom: 6px;
        }
        .brand-logo {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .sync-btn {
            background: #1e293b;
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tab-bar {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 4px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #1e293b;
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .review-card-container {
            width: 100%;
            max-width: 480px;
            margin-bottom: 14px;
        }
        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .preview-img-box {
            width: 100%;
            height: 360px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .preview-img-box img {
            width: 92%;
            height: 92%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }
        .badge-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .badge-green { color: var(--green); border-color: rgba(16, 185, 129, 0.4); }
        .badge-gold { color: var(--gold); border-color: rgba(245, 158, 11, 0.4); }
        .card-body {
            padding: 16px;
        }
        .card-title {
            font-size: 1.18rem;
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-quote {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 12px;
            font-style: italic;
        }
        .card-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--surface-card);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .meta-label { color: var(--text-sub); font-size: 0.7rem; margin-bottom: 2px; }
        .meta-val { font-weight: 700; color: #fff; }

        /* 4-Button Controls Grid */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 8px;
        }
        .btn {
            border: none;
            outline: none;
            border-radius: 16px;
            padding: 14px 10px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-discard {
            background: #1e2433;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-hold {
            background: #1e293b;
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .btn-undo {
            background: #182030;
            color: var(--text-sub);
            border: 1px solid var(--border);
            grid-column: span 2;
            padding: 10px;
            font-size: 0.82rem;
        }
        .btn-approve {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(16, 185, 129, 0.35);
        }

        /* Toast Notice */
        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--accent);
            display: none;
            z-index: 1000;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 40px 16px;
            background: var(--surface);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            border: 1px dashed var(--border);
        }
        .nav-links {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            font-size: 0.82rem;
        }
        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            padding: 8px 12px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="toast" id="toastNotice"></div>

    <div class="header">
        <div class="brand-logo">🌊 NEWAVE STUDIO®</div>
        <button class="sync-btn" onclick="forceSyncServer()">
            <span>🔄</span> ดึงลายใหม่ (<span id="totalServerCount">8</span>)
        </button>
    </div>

    <!-- Status Tabs -->
    <div class="tab-bar">
        <div class="tab-btn active" id="tabPending" onclick="switchTab('pending')">🟡 รอตรวจ (<span id="cPending">0</span>)</div>
        <div class="tab-btn" id="tabHold" onclick="switchTab('hold')">⏳ เก็บไว้ก่อน (<span id="cHold">0</span>)</div>
        <div class="tab-btn" id="tabApproved" onclick="switchTab('approved')">🟢 อนุมัติแล้ว (<span id="cApproved">0</span>)</div>
    </div>

    <div class="review-card-container" id="cardContainer">
        <!-- Injected via JS -->
    </div>

    <div class="controls-grid" id="controlsGrid">
        <button class="btn btn-discard" onclick="handleDecision('discard')">
            <span>🗑️</span> ไม่เอา (ทิ้ง)
        </button>
        <button class="btn btn-hold" onclick="handleDecision('hold')">
            <span>⏳</span> ข้ามไว้ก่อน (วนต่อคิว)
        </button>
        <button class="btn btn-approve" style="grid-column: span 2;" onclick="handleDecision('approve')">
            <span>✅</span> เอาลายนี้ (APPROVE)
        </button>
        <button class="btn btn-undo" id="btnUndo" onclick="handleUndo()" style="display:none;">
            <span>↩️</span> ย้อนกลับไปดูลายก่อนหน้า
        </button>
    </div>

    <div class="empty-state" id="emptyState">
        <div style="font-size: 2.8rem; margin-bottom: 10px;">🎉</div>
        <h2 style="font-size: 1.25rem; margin-bottom: 8px;" id="emptyTitle">ตรวจครบทุกแบบแล้ว!</h2>
        <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px;" id="emptySub">
            ไม่มีรายการค้างตรวจในหมวดนี้แล้ว คุณสามารถกดปุ่ม "🔄 ดึงลายใหม่" หรือเปิดแท็บ 'เก็บไว้ก่อน' เพื่อตรวจซ้ำได้ครับ
        </p>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button onclick="forceSyncServer(true)" style="background: var(--surface); color: var(--accent); border: 1px solid var(--accent); font-weight: 700; padding: 10px 18px; border-radius: 12px; cursor: pointer;">
                🔄 รีเซ็ตคลังตรวจทั้งหมด
            </button>
            <a href="dashboard.html" style="background: var(--accent); color: #0b0f19; font-weight: 800; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-size: 0.9rem;">
                ไปที่ Upload Dashboard ➔
            </a>
        </div>
    </div>

    <div class="nav-links">
        <a href="dashboard.html">📱 Upload Dashboard</a>
        <a href="marketing.html">🚀 Marketing Hub</a>
        <a href="index.html">🌐 เว็บไซต์แบรนด์</a>
    </div>

    <script>
        const SERVER_CATALOG = [{"id": "37", "title": "Emotional Support Iced Matcha", "category": "🍵 Kawaii Matcha & Cafe Aesthetic", "style": "Kawaii Pastel Chibi", "quote": "Emotional Support Iced Matcha", "thumb": "assets/thumbs/thumb_37.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #37 TREND (MATCHA CAFE)", "suggested_products": "Iced Drink Tumbler, Kawaii Tee, Sticker"}, {"id": "36", "title": "My Favorite Outdoor Activity Is Going Back Inside", "category": "🏡 Cozy Homebody & Introvert Scandinavian", "style": "Minimalist Fine-Line Scandinavian", "quote": "My Favorite Outdoor Activity Is Going Back Inside", "thumb": "assets/thumbs/thumb_36.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #36 TREND (COZY INTROVERT)", "suggested_products": "Minimalist Hoodie, Canvas Tote, Cozy Mug"}, {"id": "35", "title": "Per My Last Email (I Am Screaming)", "category": "💼 Corporate Burnout & Y2K Humor", "style": "90s Retro Y2K OS Pixel", "quote": "Per My Last Email (I Am Screaming Internally)", "thumb": "assets/thumbs/thumb_35.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #35 TREND (OFFICE)", "suggested_products": "Office Ceramic Mug, Laptop Sticker, Desk Mat"}, {"id": "34", "title": "Howdy, I'm Overstimulated", "category": "🐸 Vintage Western & Mascot Humor", "style": "70s Western Mascot Retro", "quote": "Howdy, I'm Overstimulated", "thumb": "assets/thumbs/thumb_34.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #34 TREND (WESTERN)", "suggested_products": "Camping Enamel Mug, Graphic Tee, Tumbler"}, {"id": "33", "title": "PARALLEL REALITY // ARCHIVE 02", "category": "🌊 Contemporary Streetwear [NWS]", "style": "Architectural Minimalist Typography", "quote": "NEWAVE® STUDIO // PARALLEL REALITY ARCHIVE", "thumb": "assets/thumbs/thumb_33.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #33 HIGH-MARGIN", "suggested_products": "Heavyweight Boxy Tee, Dark Oversized Hoodie"}, {"id": "32", "title": "Just One More Chapter & More Coffee", "category": "📖 Bookworm & Caffeine Club", "style": "1930s Rubber-Hose Retro", "quote": "Just One More Chapter and More Coffee", "thumb": "assets/thumbs/thumb_32.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #32 TREND", "suggested_products": "Ceramic Mug, Tote Bag, Reading Tee"}, {"id": "31", "title": "I Have No Desire to Be Perceived Today", "category": "🐱 Introvert Cat Club", "style": "Kawaii Pastel Chibi", "quote": "I Have No Desire to Be Perceived Today", "thumb": "assets/thumbs/thumb_31.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #31 TREND", "suggested_products": "Oversized Hoodie, Ceramic Mug, Tote Bag"}, {"id": "30", "title": "Fueled by Iced Coffee & Mild Panic", "category": "☕ Coffee & Work Humor", "style": "70s Retro Groovy Mascot", "quote": "Fueled by Iced Coffee and Mild Panic", "thumb": "assets/thumbs/thumb_30.jpg", "trademark_safe": true, "seo_rank": "🔥 BATCH #30 TREND", "suggested_products": "Thermal Tumbler, T-Shirt, Laptop Sticker"}];

        let currentTab = 'pending';
        let pendingQueue = JSON.parse(localStorage.getItem('nws_pending_queue') || 'null');
        let holdQueue = JSON.parse(localStorage.getItem('nws_hold_queue') || '[]');
        let approvedList = JSON.parse(localStorage.getItem('nws_approved_designs') || '[]');
        let discardList = JSON.parse(localStorage.getItem('nws_discard_designs') || '[]');
        let historyStack = [];

        // AUTO-SYNC: If user has old cache, automatically merge any new designs from server catalog!
        function syncServerDesigns(silent = false) {
            const seenIds = new Set([
                ...(pendingQueue ? pendingQueue.map(x => x.id) : []),
                ...holdQueue.map(x => x.id),
                ...approvedList.map(x => x.id),
                ...discardList.map(x => x.id)
            ]);

            const newFromRemote = SERVER_CATALOG.filter(item => !seenIds.has(item.id));
            if (!pendingQueue) {
                pendingQueue = [...SERVER_CATALOG];
            } else if (newFromRemote.length > 0) {
                // Prepend new designs to the front of the queue
                pendingQueue = [...newFromRemote, ...pendingQueue];
            }
            localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            if (!silent && newFromRemote.length > 0) {
                showToast(`🔔 ดึงลายใหม่สำเร็จ ${newFromRemote.length} ลาย!`);
            }
            renderCard();
        }

        function forceSyncServer(resetAll = false) {
            if (resetAll) {
                if (confirm('คุณต้องการรีเซ็ตคลังตรวจทั้งหมดเพื่อเริ่มตรวจใหม่ใช่ไหม?')) {
                    localStorage.removeItem('nws_pending_queue');
                    localStorage.removeItem('nws_hold_queue');
                    localStorage.removeItem('nws_discard_designs');
                    pendingQueue = [...SERVER_CATALOG];
                    holdQueue = [];
                    localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
                    showToast('🔄 รีเซ็ตคลังตรวจกลับมาครบ 8 ลายแล้ว!');
                    currentTab = 'pending';
                    switchTab('pending');
                }
                return;
            }
            syncServerDesigns(false);
            showToast('✅ ซิงค์คลังลายล่าสุดเรียบร้อย!');
        }

        function showToast(msg) {
            const t = document.getElementById('toastNotice');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function updateCounts() {
            document.getElementById('cPending').innerText = pendingQueue.length;
            document.getElementById('cHold').innerText = holdQueue.length;
            document.getElementById('cApproved').innerText = approvedList.length;
            document.getElementById('btnUndo').style.display = historyStack.length > 0 ? 'flex' : 'none';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabPending').className = 'tab-btn' + (tab === 'pending' ? ' active' : '');
            document.getElementById('tabHold').className = 'tab-btn' + (tab === 'hold' ? ' active' : '');
            document.getElementById('tabApproved').className = 'tab-btn' + (tab === 'approved' ? ' active' : '');
            renderCard();
        }

        function getActiveList() {
            if (currentTab === 'pending') return pendingQueue;
            if (currentTab === 'hold') return holdQueue;
            if (currentTab === 'approved') return approvedList;
            return [];
        }

        function renderCard() {
            updateCounts();
            const list = getActiveList();
            const container = document.getElementById('cardContainer');
            const controls = document.getElementById('controlsGrid');
            const empty = document.getElementById('emptyState');

            if (list.length === 0) {
                container.style.display = 'none';
                controls.style.display = 'none';
                empty.style.display = 'block';
                if (currentTab === 'hold') {
                    document.getElementById('emptyTitle').innerText = 'ไม่มีลายที่เก็บไว้';
                    document.getElementById('emptySub').innerText = 'เมื่อคุณกด "ข้ามไว้ก่อน" ลายจะมาสะสมอยู่ที่นี่ครับ';
                } else if (currentTab === 'approved') {
                    document.getElementById('emptyTitle').innerText = 'ยังไม่มีลายที่อนุมัติ';
                    document.getElementById('emptySub').innerText = 'กดยืนยัน APPROVE เพื่อส่งลายไปขายจริง';
                } else {
                    document.getElementById('emptyTitle').innerText = 'ตรวจครบทุกแบบแล้ว!';
                    document.getElementById('emptySub').innerText = 'ระบบบันทึกลายที่ผ่านเข้าคิวผลิตเรียบร้อย';
                }
                return;
            }

            container.style.display = 'block';
            controls.style.display = 'grid';
            empty.style.display = 'none';

            const item = list[0];
            container.innerHTML = `
                <div class="review-card">
                    <div class="preview-img-box">
                        <div class="badge-bar">
                            <span class="badge badge-green">🛡️ Trademark Clean</span>
                            <span class="badge badge-gold">${item.seo_rank || 'Top Trend'}</span>
                        </div>
                        <img src="${item.thumb}" alt="${item.title}" onerror="this.src='assets/thumbs/thumb_28.jpg'">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <div class="card-quote">"${item.quote}"</div>
                        <div class="card-meta">
                            <div>
                                <div class="meta-label">หมวดหมู่ & สไตล์</div>
                                <div class="meta-val">${item.style}</div>
                            </div>
                            <div>
                                <div class="meta-label">สินค้าทำเงิน</div>
                                <div class="meta-val">${item.suggested_products}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleDecision(action) {
            const list = getActiveList();
            if (list.length === 0) return;

            const item = list.shift();
            historyStack.push({ action, item, fromTab: currentTab });

            if (action === 'approve') {
                if (!approvedList.some(d => d.id === item.id)) {
                    approvedList.push(item);
                    localStorage.setItem('nws_approved_designs', JSON.stringify(approvedList));
                }
                showToast('✅ อนุมัติลายนี้เรียบร้อย!');
            } else if (action === 'hold') {
                if (currentTab === 'pending') {
                    holdQueue.push(item);
                    localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
                } else {
                    list.push(item);
                }
                showToast('⏳ เก็บไว้ในคิวแล้ว (ไม่โดนตัดทิ้งแน่นอน!)');
            } else if (action === 'discard') {
                discardList.push(item);
                localStorage.setItem('nws_discard_designs', JSON.stringify(discardList));
                showToast('🗑️ ปฏิเสธลายนี้แล้ว');
            }

            localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
            renderCard();
        }

        function handleUndo() {
            if (historyStack.length === 0) return;
            const last = historyStack.pop();
            
            if (last.action === 'approve') {
                approvedList = approvedList.filter(d => d.id !== last.item.id);
                localStorage.setItem('nws_approved_designs', JSON.stringify(approvedList));
            } else if (last.action === 'hold') {
                holdQueue = holdQueue.filter(d => d.id !== last.item.id);
                localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
            } else if (last.action === 'discard') {
                discardList = discardList.filter(d => d.id !== last.item.id);
                localStorage.setItem('nws_discard_designs', JSON.stringify(discardList));
            }
            
            if (last.fromTab === 'pending') {
                pendingQueue.unshift(last.item);
                localStorage.setItem('nws_pending_queue', JSON.stringify(pendingQueue));
            } else if (last.fromTab === 'hold') {
                holdQueue.unshift(last.item);
                localStorage.setItem('nws_hold_queue', JSON.stringify(holdQueue));
            }

            currentTab = last.fromTab;
            switchTab(currentTab);
            showToast('↩️ ย้อนกลับรายการสำเร็จ');
        }

        // Run sync on page load
        syncServerDesigns(true);
    </script>
</body>
</html>
